# Codex CLI configuration — shared base (managed by NixOS)
#:schema https://developers.openai.com/codex/config-schema.json

model = "glm-5.2"
model_provider = "zai-proxy"
approval_policy = "on-request"
sandbox_mode = "read-only"

# Override Codex's fallback model metadata (272K cap for unknown models).
# Catalog provides full metadata for all models, including per-model
# context windows and auto-compact thresholds.
model_catalog_json = "/etc/codex/models.json"

[projects]
[projects."/"]
trust_level = "trusted"

[analytics]
enabled = false

[feedback]
enabled = false

# ── Providers ──────────────────────────────────────────────

[model_providers.zai-proxy]
name = "Z.AI via Local Proxy"
base_url = "http://127.0.0.1:4891/v1"
env_key = "GLM_API_KEY"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 4
stream_max_retries = 5
stream_idle_timeout_ms = 300000

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 4
stream_max_retries = 5

[model_providers.groq]
name = "Groq"
base_url = "https://api.groq.com/openai/v1"
env_key = "GROQ_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# ── Profiles ───────────────────────────────────────────────

[profiles.fast]
model = "openai/gpt-oss-20b"
model_provider = "groq"

[profiles.deep]
model = "deepseek/deepseek-v4-pro"
model_provider = "openrouter"
model_reasoning_effort = "high"

[profiles.deepseek-v4-pro]
model = "deepseek/deepseek-v4-pro"
model_provider = "openrouter"
model_reasoning_effort = "high"

[profiles.deepseek-v4-flash]
model = "deepseek/deepseek-v4-flash"
model_provider = "openrouter"

[profiles.router]
model = "deepseek/deepseek-v4-pro"
model_provider = "openrouter"

# ── Shell Environment ──────────────────────────────────────

[shell_environment_policy]
inherit = "core"
