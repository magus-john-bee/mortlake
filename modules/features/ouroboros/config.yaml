economics:
  default_tier: standard
  tiers:
    standard:
      cost_factor: 1
      intelligence_range:
      - 14
      - 20
      models:
      - provider: zai
        model: glm-5.2
      use_cases:
      - all
  escalation_threshold: 2
  downgrade_success_streak: 5
llm:
  backend: hermes
  permission_mode: bypassPermissions
  qa_model: glm-5.2
  dependency_analysis_model: glm-5.2
  ontology_analysis_model: glm-5.2
  context_compression_model: glm-5.2
clarification:
  ambiguity_threshold: 0.2
  max_interview_rounds: 10
  model_tier: standard
  default_model: glm-5.2
execution:
  max_iterations_per_ac: 10
  retrospective_interval: 3
  atomicity_model: glm-5.2
  decomposition_model: glm-5.2
  double_diamond_model: glm-5.2
resilience:
  stagnation_enabled: true
  lateral_thinking_enabled: true
  lateral_model_tier: standard
  lateral_temperature: 0.8
  wonder_model: moonshotai/kimi-k2.7-code
  reflect_model: deepseek-v4-pro
evaluation:
  stage1_enabled: true
  stage2_enabled: true
  stage3_enabled: true
  satisfaction_threshold: 0.8
  uncertainty_threshold: 0.3
  semantic_model: glm-5.2
  assertion_extraction_model: glm-5.2
consensus:
  min_models: 3
  threshold: 0.67
  diversity_required: true
  models:
  - glm-5.2
  - moonshotai/kimi-k2.7-code
  - deepseek-v4-pro
  advocate_model: deepseek-v4-pro
  devil_model: moonshotai/kimi-k2.7-code
  judge_model: deepseek-v4-pro
llm_profiles: {}
llm_role_profiles: {}
persistence:
  enabled: true
  database_path: data/ouroboros.db
drift:
  warning_threshold: 0.3
  critical_threshold: 0.5
runtime_controls:
  mcp_tool_timeout_seconds: 0.0
  generation_idle_timeout_seconds: 7200.0
  generation_no_progress_timeout_seconds: 14400.0
  generation_safety_timeout_seconds: 0.0
  watchdog_poll_seconds: 15.0
logging:
  level: info
  log_path: logs/ouroboros.log
  include_reasoning: true
orchestrator:
  runtime_backend: hermes
  runtime_profile: null
  permission_mode: acceptEdits
  opencode_permission_mode: bypassPermissions
  hermes_cli_path: /run/current-system/sw/bin/hermes
  default_max_turns: 10
  max_parallel_workers: 3
  use_worktrees: true
  worktree_root: ~/.ouroboros/worktrees
  worktree_cleanup: keep
  worktree_lock_stale_after_minutes: 60
